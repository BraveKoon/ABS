name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.2)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if release exists
        id: check
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        if: steps.check.outputs.exists != 'true'
        run: |
          name="abs-referee-${TAG}"
          mkdir "$name"
          cp README.md CHANGELOG.md index.html worker.js wrangler.toml "$name/"
          zip -r "${name}.zip" "$name"

      - name: Extract release notes
        if: steps.check.outputs.exists != 'true'
        run: |
          awk -v t="## ${TAG}" '
            index($0, t) == 1 && (length($0) == length(t) || substr($0, length(t) + 1, 1) == " ") {f=1; next}
            /^## / {f=0}
            f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $TAG"; exit 1; }

      - name: Create release
        if: steps.check.outputs.exists != 'true'
        run: |
          gh release create "$TAG" "abs-referee-${TAG}.zip" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
